# Non-secret run configuration. API keys go in .env (see .env.example),
# never here -- this file is meant to be committed.

channel:
  name: "The Ledger"
  niche: "financial_history"
  style_guide: "config/style_guides/financial_history.yaml"
  require_human_approval: true
  default_privacy_status: "private" # a human reviews + publishes from YouTube Studio

providers:
  llm: "anthropic"
  llm_model: "claude-sonnet-4-5"
  image: "openai"
  image_model: "gpt-image-1"
  tts: "elevenlabs"
  tts_voice: "narrator"

video:
  target_minutes: [10.0, 18.0]
  resolution: [1920, 1080]
  fps: 30
  ken_burns_zoom_range: [1.0, 1.06]
  scene_min_duration_sec: 6.0
  scene_max_duration_sec: 14.0
  subtitle_font: "Arial"
  subtitle_max_chars_per_line: 42

workspace_dir: "workspace"
