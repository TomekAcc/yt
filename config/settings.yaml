# Non-secret run configuration. API keys go in .env (see .env.example),
# never here -- this file is meant to be committed.

channel:
  name: "The Ledger"
  niche: "financial_history"
  style_guide: "config/style_guides/financial_history.yaml"
  require_human_approval: true
  default_privacy_status: "private" # a human reviews + publishes from YouTube Studio

providers:
  # llm: one of "anthropic" | "gemini" -- gemini reuses the same
  # GEMINI_API_KEY as images/voice below, so only one key is needed overall.
  llm: "gemini"
  llm_model: "gemini-3.6-flash"
  # image: one of "gemini" | "openai" | "stability" -- image_model must match
  # whichever is active (gemini-3.1-flash-image / gpt-image-1 / n/a).
  # Gemini's model names change fairly often -- if this starts 404ing,
  # check https://ai.google.dev/gemini-api/docs/models for the current name.
  image: "gemini"
  image_model: "gemini-3.1-flash-image"
  # tts: one of "elevenlabs" | "gemini" | "openai" -- elevenlabs gives the
  # richest voice quality and native word-timestamps (best subtitle sync)
  # but its free tier forbids commercial/monetized use; gemini reuses the
  # same GEMINI_API_KEY as above with no such restriction.
  tts: "gemini"
  tts_voice: "narrator"
  tts_model: "gemini-3.1-flash-tts-preview"

video:
  target_minutes: [10.0, 18.0]
  resolution: [1920, 1080]
  fps: 30
  # How much each image visibly zooms over its on-screen duration -- higher
  # = more noticeable motion, so a still image doesn't feel static.
  ken_burns_zoom_range: [1.0, 1.15]
  scene_min_duration_sec: 6.0
  # How long a single image is held (also the pacing target used when
  # writing the script) -- lower = images change more often.
  scene_max_duration_sec: 12.0
  subtitle_font: "Arial"
  subtitle_max_chars_per_line: 42
  # Distance of the captions from the bottom edge, in pixels at 1080p.
  # Lower = closer to the bottom of the frame.
  subtitle_margin_v: 40

workspace_dir: "workspace"
